[workspace]
resolver = "2"
# programs/verdict (Anchor) and sp1/ are added by their owners.
members = ["crates/verdict-rules", "programs/verdict"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
