# Fly.io config for apps/server (+ static apps/stage), deployed as the `youre-on` app
# (API-CONTRACT §1.1). Secrets go in `fly secrets set` (names: SETUP-CHECKLIST §7),
# never here; [env] holds non-secret config only (TASKS K-08).
app = "youre-on"
primary_region = "dfw"

[build]
  dockerfile = "apps/server/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  LOCK_MODE = "atomic"
  DEMO_MODE = "true"
  VOICE_DEMO_ONLY = "false" # the voice judge (and "Jarvis") for every player, not just demo-a/demo-b
  CACHED_RULING = "false" # boot default; "true" = the stored demo-bottle ruling (no model call). POST /v1/demo/toggles switches it at runtime, no restart
  LLM_PROVIDER = "live"
  ALLOW_SPEND = "true" # the spend guard: live providers refuse to start without it
  PUBLIC_BASE_URL = "https://youre-on.fly.dev"
  PROGRAM_ID = "BL3gwTBcftGQFdPNp7rZiAyDojkSusdAJ2dzNvFouwcp" # = packages/shared ESCROW_ID; env.ts rejects any other value
  USDC_MINT = "4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU"
  # ELEVENLABS_AGENT_ID = "<agent id>"  (set once scripts/el-agent.ts has created the agent)

# Migrations are NOT run on deploy: they run from L's laptop over DATABASE_URL_DIRECT
# (`npm run db:migrate -w packages/db`), which never lives on Fly (SETUP-CHECKLIST §7).

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: in-process WS fan-out, timers and nonce leases (ARCHITECTURE §1.3).
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
