# Fly.io config for apps/server (+ static apps/stage later). WRITTEN, NOT DEPLOYED.
# PENDING (window): the app name is fixed at `fly launch` (API-CONTRACT §1.1); Fly + Neon
# accounts don't exist yet. Secrets go in `fly secrets set` (names: SETUP-CHECKLIST §7),
# never here; [env] holds non-secret config only (TASKS K-08).
app = "youre-on" # PENDING: replace with the name `fly launch` assigns
primary_region = "dfw"

[build]
  dockerfile = "apps/server/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  LOCK_MODE = "atomic"
  DEMO_MODE = "false"
  # Non-secret, filled at deploy once known (PENDING):
  # PUBLIC_BASE_URL = "https://<app>.fly.dev"
  # PROGRAM_ID = "BL3gwTBcftGQFdPNp7rZiAyDojkSusdAJ2dzNvFouwcp" # = packages/shared ESCROW_ID; env.ts rejects any other value
  # USDC_MINT = "4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU"
  # ELEVENLABS_AGENT_ID = "<agent id>"

# Migrations are NOT run on deploy: they run from L's laptop over DATABASE_URL_DIRECT
# (`npm run db:migrate -w packages/db`), which never lives on Fly (SETUP-CHECKLIST §7).

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: in-process WS fan-out, timers and nonce leases (ARCHITECTURE §1.3, FINDINGS §3.13).
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
