[package]
name = "verdict"
version = "0.1.0"
description = "VERDICT onchain program (CONTRACTS.md §9)"
edition.workspace = true
rust-version = "1.84"
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "verdict"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Tests only, never in deployed builds (CONTRACTS.md §8.6): accepts proofs whose proof_a is 64 × 0x01.
mock-zk = []
# SP1 path (D-9), off by default: verify_sp1_run returns Sp1Disabled without it.
sp1 = []
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "=0.32.1", default-features = false, features = ["token", "token_2022"] }
groth16-solana = "0.2.0"
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
solana-sha256-hasher = "2"
solana-instructions-sysvar = "2"
solana-sdk-ids = "2"
verdict-rules = { path = "../../crates/verdict-rules" }

[dev-dependencies]
litesvm = "0.7"
solana-sdk = "2.3"
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
