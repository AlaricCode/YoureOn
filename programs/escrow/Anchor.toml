skip_local_validator = true

[toolchain]
anchor_version = "1.2.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
escrow = "BL3gwTBcftGQFdPNp7rZiAyDojkSusdAJ2dzNvFouwcp"

[programs.devnet]
escrow = "BL3gwTBcftGQFdPNp7rZiAyDojkSusdAJ2dzNvFouwcp"

[provider]
# The QuickNode devnet URL embeds a token: pass it with ANCHOR_PROVIDER_URL / `solana config`,
# never here (SETUP-CHECKLIST §5 item 12). Wallet: ANCHOR_WALLET (deployer keypair path).
cluster = "localnet"
wallet = "~/.config/solana/youre-on-deployer.json"

[scripts]
test = "cargo test"

[hooks]
