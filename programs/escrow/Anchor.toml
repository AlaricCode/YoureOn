skip_local_validator = true

[toolchain]
anchor_version = "1.2.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
escrow = "FyJQHCE1TBuaCtaueeoSzLDzV5Gns6iUSA7Yd2m8UNvm"

[programs.devnet]
escrow = "FyJQHCE1TBuaCtaueeoSzLDzV5Gns6iUSA7Yd2m8UNvm"

[provider]
# The QuickNode devnet URL embeds a token: pass it with ANCHOR_PROVIDER_URL / `solana config`,
