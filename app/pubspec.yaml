name: verdict
description: "Verdict mobile app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # Capture
  camera: ^0.11.0
  google_mlkit_face_detection: ^0.13.0
  record: ^6.0.0
  # Playback (beacon tones, start sound, read-back TTS)
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  # Crypto
  crypto: ^3.0.5
  cryptography: ^2.7.0
  image: ^4.2.0
  # Network
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  # Passkey-gated device wallet
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  # One outline icon set
  lucide_icons_flutter: ^3.0.0
  url_launcher: ^6.3.0
  sensors_plus: ^6.1.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  wakelock_plus: ^1.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  stream_channel: ^2.1.2

flutter:
  uses-material-design: false
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
