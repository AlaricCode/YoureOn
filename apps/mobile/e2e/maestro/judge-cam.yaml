# Profile -> "Judge cam" without a room (refused with a reason), then in a room: the judge-cam
# screen ("No camera" in the simulator: no lens, no crash), and back to home
# with the back arrow (which now also tells the server this device is a phone again).
# Real server writes: PATCH /v1/devices/current (role judge_cam, then phone). No bet involved.
#   maestro --device <udid> test e2e/maestro/judge-cam.yaml   (signed in, on home, no room)
appId: dev.youreon.app
name: judge-cam
---
- launchApp
- extendedWaitUntil:
    visible:
      id: balance-header
    timeout: 30000
- runFlow:
    when:
      visible:
        id: room-leave
    commands:
      - tapOn:
          id: room-leave
# No room: a judge cam must be bound to one. In the lobby the phone is always in a room (the
# lobby), so this refusal only shows on an EXPO_PUBLIC_LOBBY=off build.
- runFlow:
    when:
      notVisible:
        id: lobby-title
    commands:
      - tapOn:
          id: home-profile
      - extendedWaitUntil:
          visible: Judge cam
          timeout: 10000
      - takeScreenshot: 30-profile
      - tapOn: Judge cam
      - extendedWaitUntil:
          visible: Join room first
          timeout: 10000
      - takeScreenshot: 31-judge-cam-needs-room
# The lobby (on by default) hides the code entry and "New room" behind "Private room".
- runFlow:
    when:
      visible:
        id: home-private
    commands:
      - tapOn:
          id: home-private
- tapOn:
    id: room-create
- extendedWaitUntil:
    visible:
      id: room-code-chip
    timeout: 20000
- tapOn:
    id: home-profile
- tapOn: Judge cam
# A phone stands by; the simulator has no camera (no lens), and the stage says so.
- extendedWaitUntil:
    visible: Standing by|No camera
    timeout: 10000
- extendedWaitUntil:
    visible: No camera
    timeout: 10000
- takeScreenshot: 32-judge-cam-no-camera
- tapOn:
    id: top-back
- extendedWaitUntil:
    visible:
      id: balance-header
    timeout: 10000
- takeScreenshot: 33-judge-cam-back-home
