# iOS Simulator build only (no camera, no Face ID enrolled, no MLKit face detector): the hidden
# operator screen (long-press the balance) runs every auto check and opens each camera panel
# without crashing the app. On a phone, use it as the pre-stage checklist instead.
#   maestro --device <udid> test e2e/maestro/sim-diagnostics.yaml   (signed in, on home)
appId: dev.youreon.app
name: sim-diagnostics
---
- launchApp
- extendedWaitUntil:
    visible:
      id: balance-header
    timeout: 30000
- longPressOn:
    id: balance-header
- extendedWaitUntil:
    visible: Build diagnostics
    timeout: 10000
- waitForAnimationToEnd
# The first touch after the long-press can be swallowed: the Pressable that owned the gesture
# unmounted mid-touch (the screen swapped), and RN's responder system spends the next touch on it.
- tapOn: Run checks
- waitForAnimationToEnd
- runFlow:
    when:
      visible: Required 0/8 green
    commands:
      - tapOn:
          text: Run checks
          optional: true
# The Face ID check prompts. With Face ID enrolled in the simulator (see two-phones.sh notes:
# notifyutil com.apple.BiometricKit.enrollmentChanged) the host posts a match; without it the
# gate falls back to the passcode sheet, which takes any passcode in the simulator.
- extendedWaitUntil:
    visible: Run checks|Enter iPhone Passcode.*
    timeout: 120000
- runFlow:
    when:
      visible: Enter iPhone Passcode.*
    commands:
      - takeScreenshot: 20a-passcode-fallback
      - inputText: '1234'
      - pressKey: Enter
- extendedWaitUntil:
    visible: Run checks
    timeout: 90000
- takeScreenshot: 20-diagnostics-ran
# The model, the Keychain, the mic + LiveKit + ElevenLabs imports and the worklets all run here.
- assertVisible: .*512-d finite.*
- assertVisible: write, read-back and delete OK.*
- assertVisible: mic=granted; LiveKit \+ ElevenLabs imported.*
- scrollUntilVisible:
    element: .*nothing signed.*|.*at the passcode prompt.*
    direction: DOWN
- takeScreenshot: 21-diagnostics-faceid
- scrollUntilVisible:
    element: VisionCamera
    direction: UP
# VisionCamera: the panel needs the face detector the simulator build leaves out, so it fails
# in place (it used to abort the app).
- tapOn: VisionCamera
- extendedWaitUntil:
    visible: VisionCamera panel failed to load
    timeout: 10000
- takeScreenshot: 22-diagnostics-visioncamera
- tapOn: Close camera
# expo-camera: no camera in the simulator; the panel opens and the app stays up.
- tapOn: expo-camera
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 23-diagnostics-expocamera
- tapOn: Close camera
- assertVisible: Build diagnostics
# The stand-in design preview loads (only its face-capture step needs the detector).
- tapOn: App preview
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 24-diagnostics-preview
