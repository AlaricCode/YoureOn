# Every screen of the stand-in design preview (diagnostics > App preview), opened in turn and
# screenshotted: the only way to render the terms card, live, ruling, redo, payout, hearing,
# appeal and market screens without locking a real bet. Catches any screen that crashes or
# throws on the simulator. The list is src/preview/PreviewApp.tsx MENU, in order; each entry
# runs preview-screen.yaml (open, check, screenshot preview-<key>) and then the checks below it.
#   maestro --device <udid> test e2e/maestro/sim-preview.yaml   (signed in, on home)
appId: dev.youreon.app
name: sim-preview
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: balance-header
    timeout: 30000
- longPressOn:
    id: balance-header
- extendedWaitUntil:
    visible: App preview
    timeout: 10000
- waitForAnimationToEnd
- tapOn: App preview
- extendedWaitUntil:
    visible:
      id: menu-launch
    timeout: 10000
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: launch
# The in-app splash repeats the native one (ui/brand SplashView).
- assertVisible:
    id: splash
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: launchFailed
- assertVisible:
    id: splash-retry
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: signup
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: enroll
# Consent first: nothing is captured until it is ticked.
- assertVisible:
    id: enroll-skip
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: faceSettings
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: homeNoRoom
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: home
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: history
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: profile
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: scan
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: incoming
- assertVisible:
    id: incoming-accept
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: negotiate
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: oddsOffer
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: oddsJudge
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: terms
- assertVisible:
    id: terms-hold
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: termsTheyFirst
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: termsOdds
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: endDeclined
- assertVisible: Declined. Nothing moved.
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: endExpired
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: endFailed
- assertVisible: Couldn't lock it. Nothing moved.
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: endChanged
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: live
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: liveSelf
# The two-phone fallback: no judge cam, so the non-performer's own phone has Start and films
# (attempt.started names it the recorder). No back arrow on its camera: not a mode to leave.
- assertVisible:
    id: live-start
- tapOn:
    id: live-start
- extendedWaitUntil:
    visible: Judge cam
    timeout: 5000
- assertNotVisible:
    id: top-back
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: preview-selfCam
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: judgeCam
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: rulingWon
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: rulingLost
# Beat 5: the loser gets GG and "I appeal!" inside the window.
- assertVisible:
    id: ruling-gg
- assertVisible:
    id: ruling-appeal
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: rulingVoid
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: redo
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: payoutWon
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: payoutLost
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: payoutReverted
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: hearing
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: appeal
# The three-model panel votes, then the result stays up until Continue.
- extendedWaitUntil:
    visible: Ruling stands
    timeout: 8000
- assertVisible: Claude
- assertVisible: GPT
- assertVisible: Gemini
- takeScreenshot: preview-appeal-result
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: marketPanel
# Beat 6: Up or Down, a stake, Gemini's odds and the split.
- assertVisible:
    id: market-side-UP
- assertVisible:
    id: market-side-DOWN
- assertVisible:
    id: market-send
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: termsMarket
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: market
- tapOn:
    id: preview-menu
- runFlow:
    file: preview-screen.yaml
    env:
      KEY: demo
- tapOn:
    id: preview-menu
