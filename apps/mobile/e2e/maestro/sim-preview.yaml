# Every screen of the stand-in design preview (diagnostics > App preview), opened in turn and
# screenshotted: the only way to render the terms card, live, ruling, redo, payout, hearing,
# appeal and market screens without locking a real bet. Catches any screen that crashes or
# throws on the simulator. The list is src/preview/PreviewApp.tsx MENU.
#   maestro --device <udid> test e2e/maestro/sim-preview.yaml   (signed in, on home)
appId: dev.youreon.app
name: sim-preview
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: balance-header
    timeout: 30000
- longPressOn:
    id: balance-header
- extendedWaitUntil:
    visible: App preview
    timeout: 10000
- waitForAnimationToEnd
# The first touch after the long-press can be swallowed (see sim-diagnostics.yaml).
- tapOn: App preview
- runFlow:
    when:
      notVisible:
        id: menu-signup
    commands:
      - tapOn:
          text: App preview
          optional: true
- extendedWaitUntil:
    visible:
      id: menu-signup
    timeout: 10000
- scrollUntilVisible:
    element:
      id: menu-signup
    direction: DOWN
- tapOn:
    id: menu-signup
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: preview-signup
- tapOn:
    id: preview-menu
- scrollUntilVisible:
    element:
      id: menu-enroll
    direction: DOWN
- tapOn:
    id: menu-enroll
- waitForAnimationToEnd:
