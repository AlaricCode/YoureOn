# VERDICT Anchor workspace (CONTRACTS.md §9.1, §17).
[toolchain]
anchor_version = "0.32.1"
# Agave release used to build and test (cargo-build-sbf / platform-tools).
solana_version = "3.0.11"
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
verdict = "dbqDmF6YtjPygXTvJD31CNADoLqiUG8pZgj1zpHaMye"

[programs.devnet]
verdict = "dbqDmF6YtjPygXTvJD31CNADoLqiUG8pZgj1zpHaMye"

[workspace]
members = ["programs/verdict"]

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# LiteSVM tests (no validator, no network, no SOL): see programs/verdict/tests/.
test = "cargo test -p verdict --features mock-zk"
